# NemiPay - Configuración de Supabase CLI
project_id = "nemipay"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["http://localhost:8081"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false

[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = false

[functions.create-charge]
verify_jwt = true

[functions.check-charge]
verify_jwt = true

[functions.cancel-charge]
verify_jwt = true

[functions.pey-webhook]
verify_jwt = false

[functions.reconcile-charges]
verify_jwt = false

[functions.create-bill]
verify_jwt = true

[functions.create-share-charge]
verify_jwt = true

[functions.cancel-bill]
verify_jwt = true
